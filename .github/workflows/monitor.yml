name: LEGO Retiring Soon Monitor

on:
  schedule:
    # 10分ごとに実行(GitHub側の負荷状況により数分ずれることがあります)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # 手動実行ボタンを使えるようにする

permissions:
  contents: write   # state.json をリポジトリにコミットするために必要

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: 監視スクリプトを実行
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python check_lego.py

      - name: 状態ファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state.json"
          git push
